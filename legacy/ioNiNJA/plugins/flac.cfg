#############################################################################################################
# you can use theese as you see fit. %artist_first %artist %album %genre %year %lame %group %release %decade
# set to "" to disable
#{/pwd1/} {mask}
# ex. {/FLAC/} {h:/ioftpd/site/sorted/music/music.by.genre/%genre/%release}
# or {/FLAC/|/ARCHIVE/FLAC/} {h:/ioftpd/site/sorted/music/music.by.genre/%genre/%release}

set ioNJ(flac_audio_sorting) {
{/FLAC/|/MUSiC/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/FLAC/1. Artists_#/%artist_first/%artist/%year - %album}
{/FLAC/|/MUSiC/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/FLAC/2. Artists/%artist/%year - %album}
{/FLAC/|/MUSiC/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/FLAC/3. Date/%Y/%m. %B/%artist - %album (%year)}
{/FLAC/|/MUSiC/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/FLAC/4. Year/%decade/%year/%artist - %album}
{/FLAC/|/MUSiC/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/FLAC/5. Releases/%artist/%release}
{/FLAC/|/MUSiC/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/FLAC/6. Genre/%genre/%artist - %album}
}

########Additional info
# set to "" to disable
# This will be added tot he end of the %album variable if found in dirname
# Why? it catches regexp commands so you see a difference between several diffrent releases of the same album.
# All of which are removed before sorting since people want to tag things their own way.
# This catches things in regexp in album name instead and adds it to the end of the album name
# Note that this will ONLY affect sorting and nothing else.
set ioNJ(flac_special_sorting) {bonus|proper|promo|repack|reissue|fixed|release|trackfix|remastered|explicit|selection|retail|edition|ltd|limited edition|advance|sampler|cds|cdm|web|ep|vls|12inch|box set}

# How should the info be added to album? %special means whatever we got from dir
set ioNJ(flac_special_sorting_theme) { (%special)}

#This will only Scan 1 File in the flac dir and sort after that. This is not as accurate as using sveral files.
set ioNJ(flac_fast_sorting) 0

# Type of symlink to produce, 1= NTFS junction, 2 = ioftpd symlink
set ioNJ(flac_sym_type) 0

#Strip The from artist name?? 1= enable 0 = Disable
set ioNJ(flac_strip_the) 0


##Cover Download from here on out

# www.discogs.com api id
# Go to www.discogs.com and register then get your own id. It's free and only take a few seconds.
# is disabled from 2011, use api 2.0 now
set ioNJ(discogs_api_id) ""

#This will only Scan 1 File in the mp3 dir and sort after that. This is not as accurate as using sveral files.
set ioNJ(mp3_fast_sorting) 0

#should we download cover?
set ioNJ(flac_get_cover_enabled) 0

#should we download fanart? 1= enable 0 = Disable
set ioNJ(flac_fanart_enabled) 0

# in what order should we search the sites?
# Avalible is: discogs , amazon, audioscrobbler, local
#
# The local searches for a file in uploaded dir named *front* and copies it to folder.jpg
set ioNJ(flac_search_order) {
audioscrobbler
amazon
local
}

#Overwrite the old cover if one exists?
set ioNJ(flac_overwrite_old_cover) 0


# Try to download the Artist jpg and save it as folder.jpg, set to "" to disable
set ioNJ(flac_artist_pic) {
C:/ioFTPD/FTP-ROOT-DIR/_SORTED/FLAC/1. Artists_#/%artist_first/%artist/
C:/ioFTPD/FTP-ROOT-DIR/_SORTED/FLAC/2. Artists/%artist/
C:/ioFTPD/FTP-ROOT-DIR/_SORTED/FLAC/3. Releases/%artist/
}



