############################################
#  This plugin will sort stuff in mv
#
############################################

#REGEXP MATCHING for checking 
set ioNJ(mv_path)			{/MV/|/MViD/}

## Direcories Will be created if enabled, "" to disable
## avalible vars: %artist_first %artist %genre %year %group %decade
# %artist_first = first letter in artist name
set ioNJ(mv_sorting) {
{/MV/|/MViD/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/MViD/1. Artists_#/%mv_artist_first/%mv_artist/%mv_year - %mv_title}
{/MV/|/MViD/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/MViD/2. Artists/%mv_artist/%mv_year - %mv_title}
{/MV/|/MViD/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/MViD/3. Genre/%mv_genre/%mv_artist - %mv_title}
{/MV/|/MViD/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/MViD/4. Year/%mv_decade/%mv_year/%mv_artist - %mv_title}
{/MV/|/MViD/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/MViD/5. Date/%Y/%m. %B/%mv_artist - %mv_title}
}

## Search order for cover
set ioNJ(search_order) {
audioscrobbler
discogs
local
}

# Try to download the Artist jpg and save it as folder.jpg, set to "" to disable
set ioNJ(mv_artist_pic) {
C:/ioFTPD/FTP-ROOT-DIR/_SORTED/MViD/1. Artists_#/%mv_artist_first/%mv_artist/
C:/ioFTPD/FTP-ROOT-DIR/_SORTED/MViD/2. Artists/%mv_artist/
}

set ioNJ(mv_artist_regexp) {
}



#Symbolic Windows Links or Regular ioftpd links
# 0= Regular ioFTPD links
# 1= Symbolic windows links
set ioNJ(mv_sym_type) "0"

#specials to extract and add tot mvtitle?
set ioNJ(mv_special_sorting) {convert|web|live.+?|dcc|dvdrip|webrip|720p|1080p|ddc}

# How should the info be added to album? %special means whatever we got from dir
set ioNJ(mv_special_sorting_theme) { (%special)}

## If no nfo is found try soring anyway? HIGHLY EXPERIMENTAL USE AT YOUR OWN RISK!. 1=YES 0=no
set ioNJ(mv_no_nfo) 1

## MV TAG (1=file 2=directory 0=disabled)
set ioNJ(mv_type) 1

##
set ioNJ(mv_get_cover_enabled) 1
set ioNJ(mv_overwrite_old_cover) 0


#mvbar variables %mv_decade %mv_year %mv_artist %mv_title %mv_genre
set ioNJ(mv_bar)         "\[MvInfo\] - ( %mv_genre - %mv_year ) - \[MvInfo\]"

