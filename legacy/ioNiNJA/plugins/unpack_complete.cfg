#unpack to this path 
#{pwd} {path to unpack} {rename files in rar to dirname? 1=yes 0=no} {Delete files after successful unpacking? 1=yes 0=no} {create new sfv for unpacked files? 1=yes 0=no} {use rescene 1=yes 0=no}
#
# 1. Pwd is the pwd that it will amtch in order for it to unpack release.
# 2. There are two alternatives here
#     * set to a specific dir, it will then unpack all the releases matched in pwd to this dir
#     * set to {} to unpackt the releases in the upload dir (or parent if it's a subdir)
# 3. This determines if the file within the rar file is going to be renamed to the dirname. If it's a subdir it becomes 'release.subdir'. 1=yes 0=no
# 4. the forth argument is if we should delete the orignal dir after unpacking?

set ioNJ(UNPACK_TO_PATH) {
{/XXX/} {} {1} {1} {1} {0}
{/CiNEMA/|/XViD/} {} {1} {1} {1} {0}
{/EBOOKS/} {} {1} {1} {1} {0}
{/MOViES/} {} {1} {1} {1} {0}
{/UHD/} {} {1} {1} {1} {0}
{/TV-KiDS/} {} {1} {1} {1} {0}
{/TV/} {} {1} {1} {1} {0}
{/x264/} {} {1} {1} {1} {0}
}



#Dir to store the recene dir in. set to {} to disable
#What is rescene? http://rescene.info/ might be useful
set ioNJ(UNPACK_RESCENE_DIR) {}

# Files not to delete when unpacking (does not work on subdirs THEY WILL ALWAYS BE DELETED)
set ioNJ(UNPACK_SAVE_FILES) {\[|\.nfo$|\.url$|\.html$|\.jpg$|\.png$}


# Dirs to ignore. 
set ioNJ(UNPACK_IGNORE) {subs|vobsubs|syncfix|subpack|sample|proof}