set ioTVDB(Archive) {
C:/ioFTPD/FTP-ROOT-DIR/_SORTED/Archive/TV
}

#Where to store Posters etc (WARNIN! GTAKES UP SPACE)
set ioTVDB(TVSHOW_CACHE) "../scripts/ioNiNJA/plugins/TTDB"

# OMDb API settings. The API key is shared with the active dZSbot config.
set ioTVDB(omdb_api_key) ""
set ioTVDB(omdb_api_key_file) "../eggdrop/scripts/dZSbot/config/modules/imdb.conf"
set ioTVDB(omdb_endpoint) "https://www.omdbapi.com/"
set ioTVDB(omdb_timeout_ms) 15000
set ioTVDB(omdb_tls_verify) 0
set ioTVDB(omdb_cache_seconds) 86400

#PWD to check, set to / for all.
set ioTVDB(PATHS) {/TV/|/TV-KiDS/}

set ioTVDB(cover) {
{/TV/|/TV-KiDS/} {season} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/TV-Series/1. Title/%show_name/Season.%epseason/}
{/TV/|/TV-KiDS/} {poster} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/TV-Series/1. Title/%show_name/}
}


################# TVINFO BAR #################
set ioTVDB(INFO_BAR) {[TViNFO] - (%show_name - %epseasonx%epnum - %epname - %epfirst_aired - EP %eprating - Show %showrating) - [TViNFO]}

#Deletion of tvinfo bar
set ioTVDB(info_del_bar) {[TViNFO]*}

# 1=file, 2=folder
set ioTVDB(info_bar_type) 1


################# TV SORTING ################

# Theese will not be checked againt the tv rules (regexp seperated by |)
set ioTVDB(skiplist) {subpack|samplefix|nfo_fix|nfofix|sample_fix|dirfix|subfix}


# {pwd_to_check} {path to sort}
#rel pwd path ep season showid %first_letter showname showlink showcountry showstart showend showseasons showclass showgenre epairdate eplink eptitle episode season
set ioTVDB(sorting) {
{/TV/|/TV-KiDS/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/TV-Series/1. Title/%show_name/Season.%epseason/%epseasonx%epnum - %epname}
}

#Type of symlink 1= ntfs junction 0=ioFTPD symlink
set ioTVDB(sym_type) 0

# It will not lookup the episode on the web....
# Only Showname season and ep are avalible for this sorting
# set this to .* for all episodes, whick means no lookup on the web.
set ioTVDB(sort_no_lookup) {swedish}

#how will we sort episodes that fit the sort_no_lookup
set ioTVDB(sorting_no_lookup) {
{/TV/|/TV-KiDS/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/TV-Series/1. Title/%showname/Season.%epseason/%epseasonx%epnum - Ep%epnum}
{/TV/|/TV-KiDS/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/TV-Series/2. Date/%Y/%m. %B/%Y-%m-%d/%showname - %epseasonx%epnum - Ep%epnum}
}

#how will we sort episodes that fit the sort_no_lookup with no episode number nor season but a date, special %date variable avalible.
set ioTVDB(sorting_no_lookup_date) {
{/TV/|/TV-KiDS/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/TV-Series/1. Title/%showname/%release}
{/TV/|/TV-KiDS/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/TV-Series/2. Date/%Y/%m. %B/%Y-%m-%d/%showname - %date}
}

# If mathcing theese regexp it will be sorted accordingly
# pwd regexp place to
set ioTVDB(special_regexp_sorting) ""


# Thing not sorted by data from thetvdb or filename is dorted liek this
set ioTVDB(not_sorted) {
C:/ioFTPD/FTP-ROOT-DIR/_SORTED/TV-Series/6. NotSorted/%release
C:/ioFTPD/FTP-ROOT-DIR/_SORTED/TV-Series/2. Date/%Y/%m. %B/%Y-%m-%d/%release
}

################# HTML LINK ############## %release.html
set ioNJ(tv_get_html) "%release.html"

################# Fanart #################
#0 will disable the fanart function
#1 will use the first cover (alpha numeric)
#2 will use random fanart.
# If fanart.jpg is avalible in fanart folder it will always be used.
set ioTVDB(MAX_FANART_TYPE) 0

#max number of fanarts to dl
set ioTVDB(MAX_FANART) 20


set ioTVDB(DELETE_OLD_FANART) 0

################# POSTER #################
#0 will disable feature
#1 will use the first cover (alpha numeric)
#2 will use random poster.
# If poster.jpg is avalible in poster folder it will always be used.
set ioTVDB(MAX_POSTER_TYPE) 2

#max number of fanarts to dl
set ioTVDB(MAX_POSTER) 20

set ioTVDB(DELETE_OLD_POSTER) 0


