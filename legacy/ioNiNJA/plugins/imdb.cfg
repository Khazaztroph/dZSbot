
###########################
# iMDB PLUGIN FOR ioNiNJA #
###########################
															

##================== Basic iMDb Settings ====================

## OMDb API settings. If omdb_api_key is empty, ioNiNJA reads the key from
## the active dZSbot IMDb configuration so both use the same provider account.
set ioNJ(omdb_api_key) ""
set ioNJ(omdb_api_key_file) "../eggdrop/scripts/dZSbot/config/modules/imdb.conf"
set ioNJ(omdb_endpoint) "https://www.omdbapi.com/"
set ioNJ(omdb_timeout_ms) 15000
set ioNJ(omdb_tls_verify) 0
set ioNJ(omdb_cache_seconds) 86400

## Dirs to look for imdbinfo in? (regexp)
set ioNJ(imdb_path)			{/MOViES/|/XViD/|/HD/|/x264/|/CiNEMA/|/UHD/|/KiDS/|/TV-KiDS/|/DVDR/}

## Use Original title? 1= yes 0=no. iMDB uses local names, this will use the original name.
set ioNJ(imdborig)	1

## should we strip "the" from title? 1= yes 0=no
set ioNJ(imdb_strip_the) 0

#Screen limits, Only used for announce and variable purpose 
#Wide release of a movie (DEFAULT: screens > 1000)
set ioNJ(imdb_wide) 1000
#Limited release of a movie (DEFAULT: screens 100-999)
set ioNJ(imdb_limited) 100
#Limited release of a movie (DEFAULT > festival 1-99 screens)
set ioNJ(imdb_festival) 1
#STV release equals 0 screens
set ioNJ(imdb_stv) 0

# If no nfo is found or no imdb link is found in nfo, should we try with foldername lookup? 1=yes 0=no 
# (only works if script is loaded on complete and not on_nfo And if you run the resort command)
set ioNJ(imdb_folder_search) 1

# regexp for folder, it will use anything before this, WARNING!!! leave as is if you don't know what you're doing. WARNING!!!
set ioNJ(imdb_folder_search_regexp) {(.+?)(\.|\-|_| )(rerip|internal|directors|dir\.cut|festival|complete|scr|real\.repack|real\.custom|real\.proper|custom.+?sub|ps2dvd|ps2cd|gba|gbc|psp|xbox|gc|xbox360|ps3|wii|bluray|blu\-ray|hddvd|hdtv|pdtv|dsr|xvid|cam|jav|extended|ee|se|special.+?edition|swe|dc|directors|director|unrated|pal|ntsc|multisubs|swedish|nordic|multi|repack|stv|subbed|limited|dvdrip|720p|1080p|proper|dvdscr|screener|ts|telecine|telesync|tc|r5|xxx|s\d+e\d+|s\d+d\d+|dvdr|mdvdr|m\-dvdr|1080i|ws|fs|danish|german|norwegian)(\.|\-|_| )}

## Create a imdb.html (link) file in each dir? (%release only varaiable). Set to "" to disable
set ioNJ(imdb_get_html)		"%release.html"

##================== iMDB Bar ====================


## IMDB BAR (1=file 0=directory)
set ioNJ(imdbtype)		1

## How should out bars look like?
#Vartiables: %imdb_runtime %imdb_company %imdb_limited %imdb_title %imdb_year %imdb_rating  
#			 %imdb_country %imdb_language %imdb_color %imdb_genre %imdb_votes %imdb_director
#			 %imdb_opengross %imdb_opencountry  %imdb_openday %imdb_openyear %imdb_top250
#			 %imdb_openscreens  %imdb_screens %imdb_budget 
# Bar
set ioNJ(imdb_bar)               "\[iMDB\] - ( %imdb_title - %imdb_genre - %imdb_year - %imdb_rating with %imdb_votes votes ) - \[iMDB\]"

#Delete patterns (BE CAREFUL) Not regexp  ordinary glob, where * means everything
set ioNJ(del_imdbbar)            "\[iMDB\] - (*) - \[iMDB\]"


##================== Cover, Folder.jpg,FanArt.jpg and Movie.tbn Settings ====================

#Try to download Cover for the movie and save to folder.jpg? 1= yes 0=no
set ioNJ(imdb_get_cover)	0

#Should we overwrite folder.jpg? 1= yes 0=no
set ioNJ(overwrite_folder_jpg)	0

## Should we try to download fanart? 1= yes 0=no
set ioNJ(imdb_fanart)	0

#Should we overwrite fanart.jpg if it exists? 1= yes 0=no
set ioNJ(overwrite_fanart_jpg)	0

## Should we create a movie.tbn? (thumbnail) 1= yes 0=no
set ioNJ(imdb_tbn)	0

## In what order should we look for cover on the sites? Default order is recommended.
## AVALIBLE: tmdb, imdb_cover,impawards (are avalible)
set ioNJ(imdb_cover_site_order) {
tmdb
imdb_cover
impawards
}



##================== Sorting ====================

##
# Symbolic Windows Links or Regular ioftpd links
# 0= Regular ioFTPD links
# 1= Symbolic windows links
set ioNJ(imdb_sym_type) "0"

## Paths To Sort In? 
# Set to "" to disable. i.e set ioNJ(imdb_sorting) ""
# Variables: 
# %release 			= Release name (dirname)
# %group 			= Release group
# %limited 			= Can be: Wide, Limited, Festival, STV or TV depending on settings for screens
# %director_first 	= First letter in Director Name
# %director 		= Name df the Director(s)/Creator(s)
# %title			= Title of the Movie
# %title_first 		= First letter in Title	
# %decade 			= Decade the movie was made
# %year 			= Exact Year Movie was made
# %rating 			= Rating number (rounded to integer (whole number) 8.49 => 8 ... 8.51=> 9) 
# %votes 			= Number Of Votes
# %openscreens 		= How many screens the movie Opened To
# %screens 			= Max number of screens a movie was shown.
# %cast 			= Actor Names
# %cast_first 		= First letter of actors name
# %language			= Languages in the MOViES
# %country  		= Production country
# %genre 			= Genres of the movie
# %top250			= Number if it's in the imdb top250, if not => paths containing this will be ignored (Not sorted)
# %runtime          = Runtime of the movie 
# %company			= Distributor of the movie. United Artists etc...
# The date variables are also avalible /4. Date/%Y/%m. %B/ => /4. Date/2011/1. Jan/ And /4. Date/%Y/Week.%W/ Would be /4. Date/2011/Week.24/ 
# All (Tcl time vars) supported
#
# How to use. {PwdMatch} {PATH to create link at)
# PwdmMtch works on full path, (with release name) and is regexp
# so it could be 720p.*Bluray and that would sort everything with that in release to the specified directory.
# I.E:
# {720p|1080p} {c:/_Sorted/HD/%release}
# {dvdrip.XViD|bdrip.xvid|xvid.bdrip|xvid.dvdrip} {c:/_Sorted/SD/%release}
# {teleasync|\.ts\.|telecine|\.tc\.|\.cam\.|dvdscr|screener|bdscr|r5} {c:/_Sorted/CiNEMA/%release}
set ioNJ(imdb_sorting) {
{/MOViES/|/MOVIES/|/KiDS/|/UHD/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/MOVIES/1. Title_#/%title_first/%title (%year - %rating of 10)}
{/MOViES/|/MOVIES/|/KiDS/|/UHD/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/MOVIES/2. Title/%title (%year - %rating of 10)}
}



