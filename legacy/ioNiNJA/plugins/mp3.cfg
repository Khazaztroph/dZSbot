############################################################################################################
# you can use theese as you see fit. %artist_first %artist %album %genre %year %lame %group %release %decade
# set to "" to disable
#{/pwd1/} {mask}
# ex. {/MP3/} {h:/ioftpd/site/sorted/music/music.by.genre/%genre/%release}
# or {/MP3/|/ARCHIVE/MP3/} {h:/ioftpd/site/sorted/music/music.by.genre/%genre/%release}

set ioNJ(audio_sorting) {
{/MP3/} {C:/ioFTPD/FTP-ROOT-DIR/FTP-ROOT-DIR/Music/1. Artists_#/%artist_first/%artist/%year - %album}
{/MP3/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/Music/2. Artists/%artist/%year - %album}
{/MP3/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/Music/4. Year/%decade/%year/%artist - %album}
{/MP3/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/Music/5. Releases/%artist/%release}
{/MP3/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/Music/6. Genre/%genre/%artist - %album}
}

#Strip The from artist name?? 1= enable 0 = Disable
set ioNJ(mp3_strip_the) 0


#This will only Scan 1 File in the mp3 dir and sort after that. This is not as accurate as using sveral files.
set ioNJ(mp3_fast_sorting) 1


######### ADD TO SORTING ALBUM
# set to "" to disable
# set to "" to disable
# This will be added tot he end of the %album variable if found in dirname
# Why? it catches regexp commands so you see a difference between several diffrent releases of the same album.
# All of which are removed before sorting since people want to tag things their own way.
# This catches things in regexp in album name instead and adds it to the end of the album name
# Note that this will ONLY affect sorting and nothing else.

set ioNJ(special_sorting) {bonus|proper|promo|repack|reissue|fixed|release|trackfix|remastered|explicit|selection|retail|edition|ltd|limited edition|advance|sampler|cds|cdm|web|ep|vls|12inch|box set}

# How should the info be added to album? %special means whatever we got from dir
set ioNJ(special_sorting_theme) { (%special)}

# Type Of link to create: 1= ntfs junction, 0 = ioftpd link
set ioNJ(mp3_sym_type) 1

# www.discogs.com api id
# Go to www.discogs.com and register then get your own id. It's free and only take a few seconds.
set ioNJ(discogs_api_id) ""

# This goes online to lastfm and corrects artists name if warrented. 1=enabled 0=disabled
set ioNJ(lastfm_correction) 0

##Cover Download from here on out

#should we download cover?
set ioNJ(get_cover_enabled) 0

#should we download fanart? 1= enable 0 = Disable
set ioNJ(mp3_fanart_enabled) 0

#Should we try to get picture of artist?
set ioNJ(mp3_overwrite_old_cover)  0


# Try to download the Artist jpg and save it as folder.jpg, set to "" to disable. i.e: 
# set ioNJ(artist_pic) ""
# if set to "" this will disable the downloading of artist pictures and speed up sorting.
set ioNJ(artist_pic) {
/ioFTPD/FTP-ROOT-DIR/_SORTED/Music/1. Artists_#/%artist_first/%artist/
/ioFTPD/FTP-ROOT-DIR/_SORTED/Music/2. Artists/%artist/
/ioFTPD/FTP-ROOT-DIR/_SORTED/Music/5. Release/%artist/
}

# in what order should we search the sites?
# Avalible is: discogs , amazon, audioscrobbler, local
#
# The local searches for a file in uploaded dir named *front* and copies it to folder.jpg
set ioNJ(search_order) {
audioscrobbler
discogs
amazon
local
}

