#   This will download data from cduniversr on nfo upload
#   It's not perfect and will probably screw up from time to time
#   It will announce to irc, create bar, download cover etc.
#   It will also sort things as you want it to.
#   ONLY ENGLISH RELEASES, AND JUST RETAIL BLURAY AND DVD (NOT WEBXXX)
#   SORTING IS NOT DONE!
#
# 	TODO: Sorting, bug fixes
#
#   Enjoy! It's the first release so don't expect too much


######################################## START EDITING TO FiT YOUR NEEDS ################################################

# Skip Sorting of release matching this:
set ioNJ(Skip_xxxReg) "wmv|mp4|jav"

#regexp for getting game name (Don't know what it means? Then don't touch it!)
set ioNJ(xxxReg) {(.+?)(\.|\-|_)(disc|disc\d+|disc\d|xvid|dvdrip|bdrip|xxx|bluray|read.nfo|proper|repack|x264|720p|1080p|spanish|german|VC1)(\.|\-|_|$)}

#Try to download cover to folder.jpg? "" to disable: %release only avalible variable
set ioNJ(xxx_img_back) "back.jpg"
set ioNJ(xxx_img_front) "folder.jpg"

#create a html link for game? "" to disable (%release is the only variable)
set ioNJ(xxx_url) "%release.html"

#To disable bars: set ioNJ(game_bar) "" 
#Variables for bar: %xxxTitle %xxxDate - %xxxGenre - %xxxStudio - %xxxDirector %xxxStars
set ioNJ(xxx_bar)               "\[XXXInfo\] - ( %xxxTitle (%xxxDate) - %xxxGenre - %xxxStudio - %xxxDirector ) - \[XXXInfo\]"
set ioNJ(xxx_del_bar)            "\[XXXInfo\] - (*) - \[XXXInfo\]"

# Game Bar Type: 1= file 0= dir
set ioNJ(xxx_bar_type) 1

#Get xxxinfo from web? 1=yes 0=no
set ioNJ(xxx_get_web) 1

#get info from, order
set ioNJ(xxx_info) {
xonair
cduniverse
nfo
}

#{PWD} {SECTION}, Avalible sections are: xbox360 ps3 nds wii pc psp xbox ps2
set ioNJ(xxx_paths) {/XXX/}

#%xxxTitle (title) %xxxTitle_First %xxxDate (release date) %xxxYear %xxxStars (actors) %xxxStars_First %xxxDirector (director) %xxxDirector_First %xxxGenre (genres) %xxxStudio (studio) (All date variables)
set ioNJ(xxx_sorting) {
{/XXX/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/XXX/1. Titel/%xxxTitle_First/%xxxTitle}
{/XXX/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/XXX/2. Director/%xxxDirector_First/%xxxDirector/%xxxTitle}
{/XXX/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/XXX/3. Genre/%xxxGenre/%xxxTitle}
{/XXX/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/XXX/4. Actors/%xxxStars_First/%xxxStars/%xxxTitle}
{/XXX/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/XXX/5. Date/%Y/%m. %B/%xxxTitle}
{/XXX/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/XXX/6. Studio/%xxxStudio/%xxxTitle}
{/XXX/} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/XXX/7. Release Year/%xxxYear/%release}
}

#Symlink type 1=ntfs junction 0=ioftpd symlink
set ioNJ(xxx_sym_type) 0

# this is extracted from the dirname and added to tile in as defined in ioNJ(xxx_sorting_theme), set to "" to disable
set ioNJ(xxx_extras) {repack|disc\.\d+|disk\.\d+|proper|disc\d+|disk\d+}

# Default: Title becomes Title (Disk1)
set ioNJ(xxx_sorting_theme)  { (%special)}

#if 1st letter in release name and title doesn't match, skipp sorting: 1= enable 2=disable, this is not used when url is found in nfo
set ioNJ(xxx_check_1st_letter) 1

################################################ STOP EDiTING ########################################################