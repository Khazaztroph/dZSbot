################################
# Sorting
################################
#/pwd/~regexp~path to sort to
################################

set rsort(sorting) {
{/0DAY/} {^steinberg} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/0DAY/STEINBERG/%release}
{/APPS/} {^adobe} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/APPS/ADOBE/%release}
{/TV/} {^greys\.anatomy} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/TV/24/%release}
{/MOViES/} {^24} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/MOViES/24/%release}
{/UHD/} {^24} {C:/ioFTPD/FTP-ROOT-DIR/_SORTED/UHD/24/%release}
}


################################
# Symlink type
################################
# 0 = regular ioftpd symlink
# 1 = ntfs junction

set rsort(sym_type) 0

#################################
# SubDirs
#################################

set rsort(notparent) {^sample$|^vobs$|^covers$|^cover$|^codec$|^subs$|^ac3$|^codecs$|^cd[0-9]{1,2}$|^dis[ck][0-9]{1,2}$|^part[0-9]{1,2}$}
