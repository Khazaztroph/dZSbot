###############################################################################
#
# dZSbot default IRC theme
#
# IRC color numbers follow the mIRC color table:
# 00 white, 01 black, 02 blue, 03 green, 04 light red, 05 red, 06 purple,
# 07 orange, 08 yellow, 09 light green, 10 cyan, 11 light cyan,
# 12 light blue, 13 light magenta, 14 gray, 15 light gray.
#
###############################################################################

::dZSbot::Config::Set theme.irc.colors 0
::dZSbot::Config::Set theme.irc.bold 1

::dZSbot::Config::Set theme.bracket.open "\["
::dZSbot::Config::Set theme.bracket.close "\]"

::dZSbot::Config::Set theme.color.c1 "08"
::dZSbot::Config::Set theme.color.c2 "03"
::dZSbot::Config::Set theme.color.c3 "06"
::dZSbot::Config::Set theme.color.c4 "12"
::dZSbot::Config::Set theme.color.muted "14"
::dZSbot::Config::Set theme.color.ok "09"
::dZSbot::Config::Set theme.color.warn "08"
::dZSbot::Config::Set theme.color.error "04"

::dZSbot::Config::Set theme.section.MOVIES.c1 "05"
::dZSbot::Config::Set theme.section.MOVIES.c2 "08"
::dZSbot::Config::Set theme.section.MOVIES.c3 "12"
::dZSbot::Config::Set theme.section.TV.c1 "06"
::dZSbot::Config::Set theme.section.TV.c2 "09"
::dZSbot::Config::Set theme.section.TV.c3 "13"
::dZSbot::Config::Set theme.section.MUSIC.c1 "10"
::dZSbot::Config::Set theme.section.MUSIC.c2 "08"
::dZSbot::Config::Set theme.section.MUSIC.c3 "03"
::dZSbot::Config::Set theme.section.FLAC.c1 "11"
::dZSbot::Config::Set theme.section.FLAC.c2 "08"
::dZSbot::Config::Set theme.section.FLAC.c3 "03"
::dZSbot::Config::Set theme.section.AUDIOBOOKS.c1 "13"
::dZSbot::Config::Set theme.section.AUDIOBOOKS.c2 "08"
::dZSbot::Config::Set theme.section.AUDIOBOOKS.c3 "03"
::dZSbot::Config::Set theme.section.GAMES.c1 "12"
::dZSbot::Config::Set theme.section.GAMES.c2 "08"
::dZSbot::Config::Set theme.section.GAMES.c3 "03"
::dZSbot::Config::Set theme.section.PC.c1 "12"
::dZSbot::Config::Set theme.section.PC.c2 "08"
::dZSbot::Config::Set theme.section.PC.c3 "03"
::dZSbot::Config::Set theme.section.CONSOLE.c1 "06"
::dZSbot::Config::Set theme.section.CONSOLE.c2 "08"
::dZSbot::Config::Set theme.section.CONSOLE.c3 "03"
::dZSbot::Config::Set theme.section.EBOOKS.c1 "09"
::dZSbot::Config::Set theme.section.EBOOKS.c2 "08"
::dZSbot::Config::Set theme.section.EBOOKS.c3 "03"

::dZSbot::Config::Set theme.template.pre.public "%tag{{tag}} %c2{{release}} | %c3{{section}} | {group} | {files}F/{size}"
::dZSbot::Config::Set theme.template.pre.announce.classic "%c1{{pre_type}}: %c2{{release}} | %c3{{section}} | {group} | {files}F/{size}"
::dZSbot::Config::Set theme.template.pre.result "%c1{{prefix}}: %c2{{release}} | %c3{{section}} | {age} ago | {user}/{group} | {size} | {files}F"
::dZSbot::Config::Set theme.template.pre.activity "%tag{{section}}%tag{RACER} :: %c2{{release}} :: {racer} :: {speed_compact}"
::dZSbot::Config::Set theme.template.pre.stats.header "%c1{PRE {title} Stats}: %c2{{label}} | %c3{{releases} releases} | {files}F | {size}"
::dZSbot::Config::Set theme.template.pre.stats.top "%c1{PRE Top {label}}: %c2{{entries}}"
::dZSbot::Config::Set theme.template.upload.newdir "%tag{{tag}}%tag{{section}} :: %c2{{release}} :: {user} :: {files_label}"
::dZSbot::Config::Set theme.template.upload.first "%tag{{section}}%tag{FIRST} in %c2{{release}} by {user} - {speed_compact} :: release size - {size_compact} ::"
::dZSbot::Config::Set theme.template.upload.half "%tag{{section}}%tag{HALF} :: %c2{{release}} :: {user} :: with {files_label} :: {percent} :: {size_compact} :: {speed_compact}{others_segment}{eta_segment}"
::dZSbot::Config::Set theme.template.upload.racer "%tag{{section}}%tag{RACER} :: %c2{{release}} :: {user} :: {speed_compact}"
::dZSbot::Config::Set theme.template.upload.leader "%tag{{section}}%tag{LEADER} :: %c2{{release}} :: {user}"
::dZSbot::Config::Set theme.template.upload.complete "%tag{{tag}}%tag{{section}} :: %c2{{release}} :: {files_label} :: {size_compact}{duration_segment}{speed_segment} :: {user}"
::dZSbot::Config::Set theme.template.upload.badfile "%tag{{reason}} :: %c4{{user}} :: %c2{{release}} :: {file}"
::dZSbot::Config::Set theme.template.upload.nfo "%tag{{section}}%tag{NFO} in %c2{{release}} by {user} - {file} ::"
::dZSbot::Config::Set theme.template.upload.doublesfv "%tag{DOUBLESFV} :: %c4{{user}} :: %c2{{release}} :: {file}"
::dZSbot::Config::Set theme.template.upload.speedtest "%tag{SPEED} :: {user} :: {size_compact} :: {speed_compact} ::"
::dZSbot::Config::Set theme.template.upload.incomplete "%tag{INCOMPLETE}%tag{{section}} %c4{{release}} by {user} ::"
::dZSbot::Config::Set theme.template.imdb.public "%tag{IMDb} %bold{{label}} | %c2{{title}} ({year}) | %c3{{rating}/10} | {url}{release_suffix}"
::dZSbot::Config::Set theme.template.imdb.detail.header "IMDb details for %c2{{release}}:"
::dZSbot::Config::Set theme.template.imdb.detail.title "%bold{{title}} ({year}) | %c3{{label}} | {summary}"
::dZSbot::Config::Set theme.template.imdb.detail.genre "%c1{Genre}: {genre}"
::dZSbot::Config::Set theme.template.imdb.detail.rating "%c1{IMDb}: %c3{{rating}/10}{bar_suffix} ({votes} votes)"
::dZSbot::Config::Set theme.template.imdb.detail.director "%c1{Director}: {director}"
::dZSbot::Config::Set theme.template.imdb.detail.actors "%c1{Actors}: {actors}"
::dZSbot::Config::Set theme.template.imdb.detail.plot "%c1{Plot}: {plot}"
::dZSbot::Config::Set theme.template.imdb.detail.url "%muted{{url}}"
::dZSbot::Config::Set theme.template.tv.public "%tag{TV} %bold{{label}} | %c2{{title}} ({year}) | %c3{{rating}/10} | {seasons} seasons | {url}{release_suffix}"
::dZSbot::Config::Set theme.template.tv.detail.header "TV details for %c2{{release}}:"
::dZSbot::Config::Set theme.template.music.public "%tag{{tag}} %c2{{title}} ({year}) | %c3{{formats}} | {labels}{release_suffix}"
::dZSbot::Config::Set theme.template.music.detail "%tag{Music} %c2{{title}} ({year}) | {formats} | {labels} | {genres} | {country} | Cat#: {catno}{url_suffix}"
