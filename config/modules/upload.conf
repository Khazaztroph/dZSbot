###############################################################################
#
# Upload announce module configuration
#
###############################################################################

::dZSbot::Config::Set upload.announce.enabled 1
# Upload/site activity goes here. PRE and metadata announcements have their own
# channels in pre.conf, imdb.conf, tv.conf and music.conf.
#
# default_channel is used when no section route matches. section_channels can use
# exact names, section aliases, or simple globs. For example, XXX also matches
# XXX-PAY.
::dZSbot::Config::Set upload.announce.channel "#spam"
::dZSbot::Config::Set upload.announce.default_channel "#opers"
::dZSbot::Config::Set upload.announce.section_channels {
    {#spam {MUSIC FLAC MP3 XXX XXX-PAY}}
    {#monstra {TV-HD-NORDIC TV-SD-NORDIC X264-NORDIC X265-NORDIC UHD-NORDIC *-NORDIC}}
}
::dZSbot::Config::Set upload.announce.events {newdir first half leader complete badfile nfo doublesfv speedtest incomplete}
::dZSbot::Config::Set upload.announce.event.newdir.enabled 1
::dZSbot::Config::Set upload.announce.event.first.enabled 1
::dZSbot::Config::Set upload.announce.event.half.enabled 1
::dZSbot::Config::Set upload.announce.event.racer.enabled 0
::dZSbot::Config::Set upload.announce.event.leader.enabled 1
::dZSbot::Config::Set upload.announce.event.complete.enabled 1
::dZSbot::Config::Set upload.announce.event.badfile.enabled 1
::dZSbot::Config::Set upload.announce.event.nfo.enabled 1
::dZSbot::Config::Set upload.announce.event.doublesfv.enabled 1
::dZSbot::Config::Set upload.announce.event.speedtest.enabled 1
::dZSbot::Config::Set upload.announce.event.incomplete.enabled 1
::dZSbot::Config::Set upload.announce.sections {*}
