###############################################################################
#
# Legacy / pzs-ng compatibility announce configuration
#
###############################################################################

::dZSbot::Config::Set legacy.announce.enabled 1
::dZSbot::Config::Set legacy.announce.channel "#spam"
::dZSbot::Config::Set legacy.announce.default_channel "#opers"
::dZSbot::Config::Set legacy.announce.section_channels {
    {#spam {MUSIC FLAC MP3 XXX XXX-PAY}}
    {#monstra {TV-HD-NORDIC TV-SD-NORDIC X264-NORDIC X265-NORDIC UHD-NORDIC *-NORDIC}}
}

# Events parsed from nxTools/ioFTPD logs. Remove names from this list or set the
# per-event toggle below to 0 to silence an announce type.
::dZSbot::Config::Set legacy.announce.events {wipe close open give take approve approveadd approvedel nuke unnuke request reqfill reqdel reqwipe newdate}

::dZSbot::Config::Set legacy.announce.event.wipe.enabled 1
::dZSbot::Config::Set legacy.announce.event.close.enabled 1
::dZSbot::Config::Set legacy.announce.event.open.enabled 1
::dZSbot::Config::Set legacy.announce.event.give.enabled 1
::dZSbot::Config::Set legacy.announce.event.take.enabled 1
::dZSbot::Config::Set legacy.announce.event.approve.enabled 1
::dZSbot::Config::Set legacy.announce.event.approveadd.enabled 1
::dZSbot::Config::Set legacy.announce.event.approvedel.enabled 1
::dZSbot::Config::Set legacy.announce.event.nuke.enabled 1
::dZSbot::Config::Set legacy.announce.event.unnuke.enabled 1
::dZSbot::Config::Set legacy.announce.event.request.enabled 1
::dZSbot::Config::Set legacy.announce.event.reqfill.enabled 1
::dZSbot::Config::Set legacy.announce.event.reqdel.enabled 1
::dZSbot::Config::Set legacy.announce.event.reqwipe.enabled 1
::dZSbot::Config::Set legacy.announce.event.newdate.enabled 1
