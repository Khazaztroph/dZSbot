###############################################################################
#
# IMDb / Movies module configuration
#
###############################################################################

::dZSbot::Config::Set omdb.api_key ""
::dZSbot::Config::Set omdb.endpoint "https://www.omdbapi.com/"
::dZSbot::Config::Set omdb.timeout_ms 15000
::dZSbot::Config::Set omdb.cache_seconds 86400
::dZSbot::Config::Set omdb.max_requests 5
::dZSbot::Config::Set omdb.period_seconds 120
::dZSbot::Config::Set omdb.require_channel_flag 0

::dZSbot::Config::Set imdb.announce.enabled 1
::dZSbot::Config::Set imdb.announce.sections {MOVIES}
::dZSbot::Config::Set imdb.announce.pre_channel "#pre"
::dZSbot::Config::Set imdb.announce.staff_channel "#staff"
