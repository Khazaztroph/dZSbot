###############################################################################
#
# Music module configuration
#
###############################################################################

::dZSbot::Config::Set music.formats {mp3 flac}
::dZSbot::Config::Set music.provider "discogs"

::dZSbot::Config::Set discogs.auth_mode "token"
::dZSbot::Config::Set discogs.token ""
::dZSbot::Config::Set discogs.consumer_key ""
::dZSbot::Config::Set discogs.consumer_secret ""
::dZSbot::Config::Set discogs.endpoint "https://api.discogs.com/database/search"
::dZSbot::Config::Set discogs.timeout_ms 15000
::dZSbot::Config::Set discogs.per_page 1
::dZSbot::Config::Set discogs.user_agent "dZSbot/2.0 +https://github.com/dzsbot"
::dZSbot::Config::Set discogs.oauth.request_token_url "https://api.discogs.com/oauth/request_token"
::dZSbot::Config::Set discogs.oauth.authorize_url "https://www.discogs.com/oauth/authorize"
::dZSbot::Config::Set discogs.oauth.access_token_url "https://api.discogs.com/oauth/access_token"
::dZSbot::Config::Set discogs.oauth.access_token ""
::dZSbot::Config::Set discogs.oauth.access_token_secret ""

::dZSbot::Config::Set music.announce.enabled 1
::dZSbot::Config::Set music.announce.sections {MUSIC MP3 FLAC}
::dZSbot::Config::Set music.announce.pre_channel "#pre"
::dZSbot::Config::Set music.announce.staff_channel "#staff"
