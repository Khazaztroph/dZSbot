# Configure disk free sections as name/path pairs.
# Use forward slashes for Windows paths to avoid Tcl backslash escaping.
# These are used directly when site.commands.df.source is "local".
# Set source to "fluxftp" to read disk sections from the FluxFTP API.
# With the default "cache" source, put the same pairs in the df exporter TSV.
#
# Example:
# ::dZSbot::Config::Set site.df.sections {
#     {MOVIES "D:/ioFTPD/FTP-ROOT-DIR/MOVIES"}
#     {TV "//nas/site/TV"}
#     {MUSIC "E:/FTP/MUSIC"}
# }
#
# Dict style is also supported:
# ::dZSbot::Config::Set site.df.sections [dict create \
#     MOVIES "D:/ioFTPD/FTP-ROOT-DIR/MOVIES" \
#     TV "//nas/site/TV" \
#     MUSIC "E:/FTP/MUSIC"]
::dZSbot::Config::Set site.df.sections {}

# Configure BNC/connectivity targets as name/host/port entries.
# !bnc and !BNC are admin-only and use status.admin_channel/status.require_channel_op.
# Use this for ZNC/BNC, IRC server and FTP/ioFTPD reachability checks.
# Use "eggdrop 0" for the ZNC/IRC connection Eggdrop is already using. This is
# better than opening a second test connection to a remote ZNC.
#
# Example:
# ::dZSbot::Config::Set site.commands.bnc.targets {
#     {ZNC eggdrop 0}
#     {IRC irc.example.net 6697}
#     {FTP 127.0.0.1 5420}
# }
::dZSbot::Config::Set site.commands.bnc.targets {}

